const CAT_EMOJI = {'성격·심리':'💜','일·커리어':'💼','건강·습관':'💚','기타':'✨'};

// 카테고리 탭
const cats = ['전체', ...new Set(DATA.sites.map(s => s.category))];
const catWrap = document.getElementById('cats');
cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'cat-btn' + (c === '전체' ? ' active' : '');
  b.textContent = (CAT_EMOJI[c] || '') + ' ' + c;
  b.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    render();
  };
  catWrap.appendChild(b);
});

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', render);

function getFilter() {
  const active = document.querySelector('.cat-btn.active');
  return active ? active.textContent.replace(/^\S+\s*/, '').trim() : '전체';
}

function render() {
  const cat = getFilter();
  const q = searchInput.value.trim().toLowerCase();
  let list = DATA.sites;
  if (cat !== '전체') list = list.filter(s => s.category === cat);
  if (q) list = list.filter(s =>
    (s.title + ' ' + s.keywords + ' ' + s.name).toLowerCase().includes(q)
  );
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card fade-in';
    card.style.animationDelay = (i * 30) + 'ms';
    card.innerHTML = `
      <span class="emoji">${s.emoji || '🧩'}</span>
      <h3>${s.title}</h3>
      <p class="desc">${s.target}</p>
      <div class="meta"><span class="tag">${s.category}</span></div>
      <span class="go">→</span>`;
    card.onclick = () => location.href = s.url;
    grid.appendChild(card);
  });
  document.getElementById('count').textContent = `총 ${list.length}개 테스트`;
  if (!list.length) grid.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">검색 결과가 없습니다. 다른 키워드로 검색해보세요 🧐</p>';
}

// 인기 랭킹 (하이라이트 5개)
const HIGHLIGHTS = ['mz-radar','genius-radar','sleep-hygiene-radar','burnout-prevention-radar','adhd-focus-radar','procrastination-radar'];
const rankEl = document.getElementById('rank');
HIGHLIGHTS.forEach((name, i) => {
  const s = DATA.sites.find(x => x.name === name);
  if (!s) return;
  const item = document.createElement('div');
  item.className = 'rank-item';
  item.innerHTML = `
    <span class="num">${i + 1}</span>
    <span class="popular">${['🔥','⭐','💎','⚡','💫','🏆'][i]}</span>
    <div class="info"><h4>${s.title}</h4><span>${s.target}</span></div>`;
  item.onclick = () => location.href = s.url;
  rankEl.appendChild(item);
});

render();
</script>
